[package]
# Renamed muxl-sign -> muxl so the install command and the binary match:
# `cargo install --git <url> muxl` yields the `muxl` binary. The lib target
# keeps the name `muxl_sign` (see [lib]) so this crate's own `muxl_sign::…`
# references and the dependency on the `muxl` library (muxl-core's lib target,
# imported as `muxl`) don't collide.
name = "muxl"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "muxl_sign"

[[bin]]
name = "muxl"
path = "src/main.rs"

[dependencies]
muxl-core = { path = "../.." }
c2pa = { git = "https://github.com/streamplace/c2pa-rs.git", rev = "81d737bd", default-features = false, features = ["rust_native_crypto", "file_io"] }
mp4-atom = { git = "https://github.com/streamplace/mp4-atom.git", branch = "streamplace" }
clap = { version = "4", features = ["derive"] }
# ES256K signing is wired through CallbackSigner — c2pa-rs's
# rust_native_crypto path validates ES256K but doesn't sign with it.
k256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
# S2PA leaf cert generation. `der`/`spki`/`const-oid` are already in our
# tree transitively via k256; `x509-cert` is one new pure-rust crate that
# pins to the same version line and gives us a typed X.509 builder.
x509-cert = { version = "0.2", features = ["pem", "builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = { version = "0.7", features = ["alloc"] }
const-oid = { version = "0.9", features = ["db"] }
# SHA-1 for SubjectKeyIdentifier / AuthorityKeyIdentifier "method 1"
# of RFC 5280 § 4.2.1.2 — used only as a fingerprint label inside the
# cert, not as a cryptographic primitive.
sha1 = "0.10"
# Streaming CBOR/DRISL output for the `segment` subcommand.
dasl = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
# `verify` emits the manifest+cert+validation JSON the host consumes —
# the same shape the old iroh-streamplace uniffi binding produced.
serde_json = "1"

[dev-dependencies]
# Decode SignedEvent streams in tests as generic CBOR values. dasl's
# serde-derived deserializer doesn't round-trip internally-tagged enums
# whose variants nest types with #[serde(with = "serde_bytes")] — the
# Init event's catalog goes through that path. The Go decoder Streamplace
# uses doesn't have the issue; we just need wire-shape verification here.
serde_cbor = "0.11"
