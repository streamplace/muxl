[package]
name = "muxl-sign"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "muxl-sign"
path = "src/main.rs"

[dependencies]
muxl = { path = "../.." }
c2pa = { git = "https://github.com/streamplace/c2pa-rs.git", rev = "81d737bd", default-features = false, features = ["rust_native_crypto", "file_io"] }
mp4-atom = { git = "https://github.com/streamplace/mp4-atom.git", branch = "streamplace" }
clap = { version = "4", features = ["derive"] }
# ES256K signing is wired through CallbackSigner — c2pa-rs's
# rust_native_crypto path validates ES256K but doesn't sign with it.
k256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
# Used by the `bench-sha256` subcommand (the in-wasm baseline that the
# host-callback variant compares against).
sha2 = "0.10"
# Streaming CBOR/DRISL output for the `segment` subcommand.
dasl = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[dev-dependencies]
# Decode SignedEvent streams in tests as generic CBOR values. dasl's
# serde-derived deserializer doesn't round-trip internally-tagged enums
# whose variants nest types with #[serde(with = "serde_bytes")] — the
# Init event's catalog goes through that path. The Go decoder Streamplace
# uses doesn't have the issue; we just need wire-shape verification here.
serde_cbor = "0.11"
