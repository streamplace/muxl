[workspace]
resolver = "3"
members = ["crates/muxl"]
# Operate on both crates by default: a bare `cargo test` covers this library
# crate *and* the `muxl` CLI crate, while a bare `cargo run` still resolves to
# the one binary in the workspace — `muxl`, which lives in crates/muxl (it
# depends on this crate + c2pa, so it can't live in the library crate).
default-members = [".", "crates/muxl"]


[package]
# The library crate is `muxl-core`; its lib target keeps the name `muxl` (see
# [lib] below) so downstream code still writes `use muxl::…`. The `muxl` CLI
# binary lives in crates/muxl, which depends on this crate.
name = "muxl-core"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "muxl"
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["wasm-bindgen", "js-sys"]

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
dasl = "0.2"
hex = "0.4"
mp4-atom = { git = "https://github.com/streamplace/mp4-atom.git", branch = "streamplace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
tempfile = "3"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
